<style>
:root{
  --deep:#0E2352;
  --sky:#2F6FE4;
  --sky-soft:#4E8BF5;
  --sun:#FFC93C;
  --coral:#FF5E5B;
  --mint:#2ED3A0;
  --paper:#FFF8EC;
  --ink:#111A33;
  --shadow:0 5px 0 rgba(9,20,48,.35);
  --font:"Baloo 2","Fredoka","Nunito","Segoe UI Rounded","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--paper);
  background:
    radial-gradient(120% 60% at 85% -5%, rgba(255,201,60,.55) 0 22%, rgba(255,201,60,0) 60%),
    linear-gradient(178deg,#173A86 0%, var(--deep) 55%, #08183C 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fadeIn .25s ease both}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- home ---------- */
.brand{position:relative;text-align:center;padding:14px 0 6px}
.globe{font-size:74px;line-height:1;display:inline-block;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:spinGlobe 9s linear infinite}
@keyframes spinGlobe{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
h1{
  margin:2px 0 2px;font-size:clamp(38px,12vw,54px);font-weight:800;letter-spacing:-1px;
  color:var(--sun);text-shadow:0 4px 0 #B5731A, 0 8px 14px rgba(0,0,0,.35);
}
.tagline{margin:0 0 18px;font-size:16px;font-weight:500;color:#BFD3FF}
.label{font-size:15px;font-weight:700;color:#9FBAF0;margin:20px 2px 8px}
.modes{display:grid;gap:10px}
.mode{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease;
}
.mode .ic{font-size:28px;line-height:1}
.mode b{display:block;font-size:18px;font-weight:800}
.mode span{display:block;font-size:13px;font-weight:500;color:#5B6885;line-height:1.25}
.mode[aria-pressed="true"]{background:var(--sun);transform:translateY(3px);box-shadow:0 2px 0 rgba(9,20,48,.35), inset 0 0 0 3px rgba(255,255,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:rgba(255,255,255,.1);color:var(--paper);border:2px solid rgba(255,255,255,.35);
  border-radius:999px;padding:9px 14px;font-size:15px;font-weight:700;
}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--ink);color:var(--ink)}
.play{
  margin-top:24px;width:100%;background:var(--coral);color:#fff;border:3px solid var(--ink);
  border-radius:18px;padding:16px;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(9,20,48,.45);
}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(9,20,48,.45)}
.best{text-align:center;margin-top:12px;font-size:14px;font-weight:600;color:#9FBAF0;min-height:20px}
.sound{
  position:absolute;top:10px;right:0;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);
  color:var(--paper);border-radius:12px;width:44px;height:44px;font-size:20px;
}

.playerrow{display:flex;gap:8px}
.nameIn{
  flex:1;min-width:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  padding:12px 14px;font-size:18px;font-weight:700;font-family:inherit;box-shadow:var(--shadow);
}
.nameIn::placeholder{color:#9AA6C0;font-weight:600}
.addP{background:var(--mint);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:0 18px;font-size:17px;font-weight:800;box-shadow:var(--shadow)}
.board{margin-top:14px;border-top:2px dashed #C8D2E6;padding-top:10px;text-align:left}
.board h3{margin:0 0 6px;font-size:14px;font-weight:700;color:#5B6885}
.board div{display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:#33405E;padding:2px 0}
.board div.me{color:var(--sky)}
.board i{font-style:normal;font-size:12px;color:#8C99B5;font-weight:600}
.fuel.low{background:linear-gradient(90deg,#FF2E2A,var(--coral));animation:blink .6s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.plane.fall{animation:fall .9s ease-in forwards}
@keyframes fall{to{transform:translate(-50%,120px) rotate(70deg);opacity:0}}
.who{font-size:17px;font-weight:700;color:#5B6885}

/* ---------- game ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hud .quit{background:none;border:none;color:#9FBAF0;font-size:22px;padding:4px 6px}
.pips{display:flex;gap:4px;flex:1}
.pip{height:8px;flex:1;border-radius:4px;background:rgba(255,255,255,.18)}
.pip.ok{background:var(--mint)}.pip.bad{background:var(--coral)}.pip.now{background:var(--sun)}
.score{font-size:20px;font-weight:800;color:var(--sun);min-width:62px;text-align:right}
.runway{position:relative;height:14px;border-radius:8px;background:rgba(255,255,255,.15);overflow:visible;margin-bottom:16px}
.fuel{position:absolute;inset:0;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--coral),var(--sun));transform-origin:left}
.plane{position:absolute;top:-13px;font-size:22px;transform:translateX(-50%)}

.ask{
  position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;
  padding:12px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px;
}
.ask .kicker{font-size:13px;font-weight:700;color:#5B6885;margin-bottom:4px}
.ask .big{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1.1;margin:0}
.ask .flagbox{width:min(330px,92%);margin:8px auto 2px}
.say{margin-top:10px;background:var(--sky);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700}
.streak{position:absolute;top:-14px;left:-8px;background:var(--mint);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800;transform:rotate(-7deg)}

.opts{display:grid;gap:12px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{
  background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:4px;
  box-shadow:var(--shadow);color:var(--ink);font-size:17px;font-weight:700;line-height:1.2;
  transition:transform .1s ease, box-shadow .1s ease, background .15s ease;
}
.opts:not(.grid2) .opt{padding:15px 14px;text-align:center}
.opt:active{transform:translateY(4px) scale(.99);box-shadow:0 1px 0 rgba(9,20,48,.35)}
.opt.right{background:var(--mint);animation:pop .35s ease}
.opt.wrong{background:#FFB0AE;animation:shake .35s ease}
.opt.dim{opacity:.45}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.flag{position:relative;width:100%;aspect-ratio:3/2;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#DCE4F2;display:flex;align-items:center;justify-content:center}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.flag.emoji{font-size:82px;background:#fff}
.opts.grid2{gap:10px}

.gain{
  position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-size:44px;font-weight:800;
  color:var(--sun);text-shadow:0 3px 0 #8A5A12;pointer-events:none;animation:rise 1s ease forwards;z-index:9
}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}

/* ---------- end ---------- */
.result{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);text-align:center}
.stamp{display:inline-block;border:4px double var(--coral);color:var(--coral);border-radius:14px;padding:6px 16px;font-size:20px;font-weight:800;transform:rotate(-6deg);margin-bottom:10px}
.stars{font-size:42px;letter-spacing:4px;margin:4px 0}
.total{font-size:58px;font-weight:800;line-height:1;color:var(--sky)}
.totlab{font-size:15px;font-weight:700;color:#5B6885;margin-bottom:14px}
.rows{text-align:left;font-size:15px;font-weight:600;color:#33405E;border-top:2px dashed #C8D2E6;padding-top:12px}
.rows div{display:flex;justify-content:space-between;padding:3px 0}
.missed{margin-top:12px;font-size:14px;font-weight:600;color:#5B6885;text-align:left}
.missed b{color:var(--ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
</style>

  <button class="play" id="againBtn">Letět znovu ✈️</button>
  <button class="play" id="homeBtn" style="background:var(--sky);margin-top:10px">Změnit let</button>
</section>

/* ============ POMOCNÉ ============ */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const emoji=c=>c.toUpperCase().replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt(0)));

function flagEl(code){
  const box=document.createElement('div');box.className='flag';
  const img=new Image();img.alt="";img.src="https://flagcdn.com/w320/"+code+".png";
  img.onerror=()=>{box.classList.add('emoji');box.textContent=emoji(code)};
  box.appendChild(img);return box;
}
function beep(type){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const notes = type==="ok"?[660,880,1180]:type==="bad"?[200,150]:[520];
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.09;
      o.type=type==="bad"?"square":"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.25);
    });
  }catch(e){}
}
let voice=null;
function pickVoice(){
  try{const v=speechSynthesis.getVoices();voice=v.find(x=>/cs[-_]?CZ|Czech|čeština/i.test(x.lang+x.name))||null}catch(e){}
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){
  if(!sound||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="cs-CZ";u.rate=.92;u.pitch=1.05;if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const mem={};
function ls(){try{const t="__t";localStorage.setItem(t,t);localStorage.removeItem(t);return localStorage}catch(e){return null}}
async function loadK(k){
  try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch(e){}
  const s=ls();
  if(s){try{const v=s.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}}
  return (k in mem)?mem[k]:null;
}
async function saveK(k,v){
  mem[k]=v;
  const s=ls();if(s){try{s.setItem(k,JSON.stringify(v))}catch(e){}}
  try{await window.storage.set(k,JSON.stringify(v))}catch(e){}
}

/* --- 5. pád (oslovení) --- */
const VOC={"petr":"Petře","pavel":"Pavle","karel":"Karle","havel":"Havle","jiří":"Jiří","ivan":"Ivane"};
function vocative(nm){
  if(!nm)return "cestovateli";
  const low=nm.toLowerCase();
  if(VOC[low])return VOC[low];
  const last=low.slice(-1), last2=low.slice(-2);
  if(last==="a")return nm.slice(0,-1)+"o";                 // Honza→Honzo, Eva→Evo
  if("eiouyáéíóúůý".includes(last))return nm;               // Marie, Jiří, Nikol… beze změny
  if("kghx".includes(last)||last2==="ch")return nm+"u";     // Marek→Marku, Vojtěch→Vojtěchu
  if("jcčřšžďťňsz".includes(last))return nm+"i";            // Matěj→Matěji, Tomáš→Tomáši
  if(last==="r")return nm+"e";                              // Otakar→Otakare
  return nm+"e";                                            // Jan→Jane, Adam→Adame
}

/* --- znělka na konci kola --- */
function melody(kind){
  if(!sound)return 0;
  const S={
    gold:[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.34],[880,.86,.14],[1047,1.0,.5]],
    good:[[523,0,.16],[659,.16,.16],[784,.32,.44]],
    ok:  [[440,0,.18],[523,.18,.18],[659,.36,.36]],
    meh: [[440,0,.2],[392,.2,.36]]
  }[kind];
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    S.forEach(([f,at,d])=>{
      const t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.22,t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);
    });
  }catch(e){return 0}
  const last=S[S.length-1];return last[1]+last[2];
}

    b.onclick=()=>{sel.mode=m.id;buildHome();beep("tick")};

    host.innerHTML="";

async function showBest(){
  const top=await loadK(hofKey())||[];
  const mine=top.filter(e=>e.n===player).sort((a,b)=>b.s-a.s)[0];
  const unit=sel.mode==="crazy"?" států":" bodů";

function setPlayer(nm){
  nm=(nm||"").trim().replace(/\s+/g," ");
  if(!nm)return;
  nm=nm.charAt(0).toUpperCase()+nm.slice(1);
  playersList=[nm,...playersList.filter(p=>p!==nm)].slice(0,8);
  player=nm;saveK("vlajkolet:players",playersList);saveK("vlajkolet:last",nm);
  $("nameIn").value="";buildHome();beep("ok");say("Ahoj, "+vocative(nm)+"!");
}
async function boot(){
  playersList=await loadK("vlajkolet:players")||[];
  const last=await loadK("vlajkolet:last");
  player=(last&&playersList.includes(last))?last:(playersList[0]||"");
  buildHome();
}

/* ============ OTÁZKY ============ */
function pool(){
  const p=D.filter(x=>sel.cont==="all"||x.k===sel.cont);
  if(sel.mode==="crazy")return {all:p,use:p};    // bláznivý let = všechny obtížnosti dohromady
  let byDiff = sel.diff===1 ? p.filter(x=>x.f===1)
             : sel.diff===2 ? p.filter(x=>x.f<=2)
             : p;
  if(byDiff.length<6) byDiff=p;           // malé kontinenty (Oceánie) – nesmí dojít státy
  return {all:p,use:byDiff};
}
let usedPool=[];
function pickAnswer(use){
  let cand=use.filter(x=>!usedPool.includes(x.n));
  if(!cand.length){usedPool=[];cand=use}
  let a;
  if(sel.diff===3&&sel.mode!=="crazy"){const hard=cand.filter(x=>x.f===3);a=(hard.length&&Math.random()<.7)?rnd(hard):rnd(cand)}
  else a=rnd(cand);
  usedPool.push(a.n);if(usedPool.length>40)usedPool.shift();
  return a;
}
function makeOne(type){
  const {all,use}=pool();
  const a=pickAnswer(use);
  let cands=(sel.diff===3&&sel.mode!=="crazy"?all.filter(x=>x.k===a.k):use).filter(x=>x.n!==a.n);
  if(cands.length<3)cands=D.filter(x=>x.n!==a.n);
  if(type==="cap")cands=cands.filter(x=>x.cap!==a.cap);
  let opts=[a,...shuffle(cands.slice()).slice(0,3)];
  // odpovědi se čtou → řadíme podle abecedy; vlajky se nečtou → náhodně
  if(type==="name")      opts.sort((x,y)=>x.n.localeCompare(y.n,"cs"));
  else if(type==="cap")  opts.sort((x,y)=>x.cap.localeCompare(y.cap,"cs"));
  else                   opts=shuffle(opts);
  return {a,opts,type};
}
function qType(){return sel.mode==="crazy"?rnd(["flag","name","cap"]):sel.mode}
function makeQuestions(){usedPool=[];return Array.from({length:QN},()=>makeOne(sel.mode))}
function qAt(i){while(game.q.length<=i)game.q.push(makeOne(qType()));return game.q[i]}

/* ============ HRA ============ */
function start(){
  beep("tick");usedPool=[];
  const crazy=sel.mode==="crazy";
  game={q:crazy?[]:makeQuestions(),i:0,score:0,streak:0,best:0,ok:0,miss:[],t0:0,locked:false,crazy,fuel:FUEL_MAX,warned:99};
  screen("s-game");
  $("plane").textContent="✈️";$("plane").classList.remove("fall");
  $("pips").style.display=crazy?"none":"flex";
  $("pips").innerHTML=crazy?"":Array.from({length:QN},()=>'<div class="pip"></div>').join("");
  render();
}
function screen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}

function render(){
  const g=game,q=g.crazy?qAt(g.i):g.q[g.i];g.locked=false;
  $("score").textContent=g.crazy?("✈️ "+g.ok):g.score;
  if(!g.crazy)[...$("pips").children].forEach((p,i)=>p.classList.toggle("now",i===g.i));

  const ask=$("ask");ask.innerHTML="";
  if(g.streak>=2){const s=document.createElement("div");s.className="streak";s.textContent="🔥 "+g.streak+"× v řadě";ask.appendChild(s)}

  const opts=$("opts");opts.innerHTML="";opts.className="opts";

  if(q.type==="flag"){
    ask.insertAdjacentHTML("beforeend",`<div class="kicker">Najdi vlajku státu</div><p class="big">${q.a.n}</p>`);
    const btn=document.createElement("button");btn.className="say";btn.textContent="🔊 Řekni to znovu";
    btn.onclick=()=>say(q.a.n);ask.appendChild(btn);
    say(q.a.n);
    opts.classList.add("grid2");
    q.opts.forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.appendChild(flagEl(o.c));
      b.onclick=()=>answer(b,o.n===q.a.n,q);opts.appendChild(b);
    });
  }
  if(q.type==="name"){
    ask.insertAdjacentHTML("beforeend",`<div class="kicker">Které zemi patří tahle vlajka?</div>`);
    const box=document.createElement("div");box.className="flagbox";box.appendChild(flagEl(q.a.c));ask.appendChild(box);
    say("Které zemi patří tato vlajka?");
    q.opts.forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o.n;
      b.onclick=()=>answer(b,o.n===q.a.n,q);opts.appendChild(b);
    });
  }
  if(q.type==="cap"){
    ask.insertAdjacentHTML("beforeend",`<div class="kicker">Hlavní město státu</div>`);
    const box=document.createElement("div");box.className="flagbox";box.appendChild(flagEl(q.a.c));ask.appendChild(box);
    ask.insertAdjacentHTML("beforeend",`<p class="big">${q.a.n}</p>`);
    const btn=document.createElement("button");btn.className="say";btn.textContent="🔊 Řekni to znovu";
    btn.onclick=()=>say("Hlavní město státu "+q.a.n);ask.appendChild(btn);
    say("Hlavní město státu "+q.a.n);
    q.opts.forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o.cap;
      b.onclick=()=>answer(b,o.cap===q.a.cap,q);opts.appendChild(b);
    });
  }
  g.t0=performance.now();
  tick();
}
function paint(r){
  $("fuel").style.transform="scaleX("+r+")";
  $("plane").style.left=(r*100)+"%";
  $("fuel").classList.toggle("low",game.crazy&&r<.34);
}
function tick(){
  cancelAnimationFrame(raf);
  let prev=performance.now();
  const step=now=>{
    const dt=now-prev;prev=now;
    let r;
    if(game.crazy){
      if(!game.locked)game.fuel-=dt;
      if(game.fuel<=0){paint(0);crash();return}
      const secs=Math.ceil(game.fuel/1000);
      if(secs<=5&&secs<game.warned){game.warned=secs;beep("tick")}
      r=game.fuel/FUEL_MAX;
    }else{
      r=Math.max(0,1-(now-game.t0)/TIME);
      if(r<=0){timeout();return}
    }
    paint(r);
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function left(){return Math.max(0,1-(performance.now()-game.t0)/TIME)}

function answer(btn,correct,q){
  if(game.locked)return;game.locked=true;
  const g=game;
  if(!g.crazy)cancelAnimationFrame(raf);
  if(correct){
    g.ok++;g.streak++;g.best=Math.max(g.best,g.streak);
    if(g.crazy){
      g.fuel=Math.min(FUEL_MAX,g.fuel+FUEL_BONUS);g.warned=99;g.score=g.ok;
      gain("+2 s ⛽");
    }else{
      const pts=Math.round((100+Math.round(100*left())+Math.min(g.streak,5)*10)*MULT[sel.diff]);
      g.score+=pts;gain("+"+pts);
      $("pips").children[g.i].className="pip ok";
    }
    btn.classList.add("right");beep("ok");buzz(30);
    setTimeout(next,g.crazy?600:750);
  }else{
    g.streak=0;g.miss.push(q.a);
    btn.classList.add("wrong");beep("bad");buzz([40,60,40]);
    markCorrect(q);
    if(!g.crazy)$("pips").children[g.i].className="pip bad";
    setTimeout(next,g.crazy?1100:1500);
  }
}
function timeout(){
  if(game.locked)return;game.locked=true;
  const q=game.q[game.i];game.streak=0;game.miss.push(q.a);
  beep("bad");markCorrect(q);
  $("pips").children[game.i].className="pip bad";
  setTimeout(next,1500);
}
function crash(){
  cancelAnimationFrame(raf);
  if(game.over)return;game.over=true;game.locked=true;
  $("plane").textContent="💥";$("plane").classList.add("fall");
  [...$("opts").children].forEach(b=>b.classList.add("dim"));
  beep("bad");buzz([80,60,120]);
  setTimeout(finish,900);
}
function markCorrect(q){
  [...$("opts").children].forEach((b,i)=>{
    const o=q.opts[i];
    const isRight = q.type==="cap" ? o.cap===q.a.cap : o.n===q.a.n;
    if(isRight)b.classList.add("right");else if(!b.classList.contains("wrong"))b.classList.add("dim");
  });
}
function gain(t){const d=document.createElement("div");d.className="gain";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function next(){
  if(game.over)return;
  game.i++;
  if(!game.crazy&&game.i>=QN)finish();else render();
}

/* ============ KONEC ============ */
const hofKey=()=>sel.mode==="crazy"?"vlajkolet:hof:crazy":"vlajkolet:hof:"+sel.mode;
async function pushHof(score){
  const k=hofKey(),list=await loadK(k)||[];
  const e={n:player||"Cestovatel",s:score,d:sel.diff,c:sel.cont,t:Date.now()};
  list.push(e);list.sort((a,b)=>b.s-a.s);
  const top=list.slice(0,12);
  await saveK(k,top);
  return {top,rank:top.indexOf(e)+1};
}
function hofRow(e,i,me){
  const medal=["🥇","🥈","🥉"][i]||(i+1+".");
  const tag=sel.mode==="crazy"?CONTS.find(c=>c.id===e.c).t.replace(" 🌍",""):DNAME[e.d];
  return `<div class="${me?"me":""}"><span>${medal} ${e.n} <i>${tag}</i></span><b>${e.s}</b></div>`;
}
async function finish(){
  cancelAnimationFrame(raf);
  const g=game;screen("s-end");
  const crazy=g.crazy;
  const stars = crazy ? (g.ok>=18?3:g.ok>=12?2:g.ok>=6?1:0)
                      : (g.ok>=9?3:g.ok>=7?2:g.ok>=5?1:0);
  $("stars").textContent="★★★".slice(0,stars)+"☆☆☆".slice(0,3-stars);
  $("stamp").textContent = crazy
    ? (stars===3?"Bláznivý as":stars===2?"Dolétnuto":stars===1?"Nouzové přistání":"Spadl hned")
    : (stars===3?"Kapitán světa":stars===2?"Dobrý let":stars===1?"Přistáno":"Ještě jednou");
  $("total").textContent=crazy?g.ok:g.score;
  $("totlab").textContent=crazy?"států doletěl, než došlo palivo":"bodů";
  $("rows").innerHTML = crazy ? `
    <div><span>Nejdelší série</span><b>${g.best}×</b></div>
    <div><span>Natankováno</span><b>${g.ok*2} vteřin</b></div>
    <div><span>Chyb</span><b>${g.miss.length}</b></div>`
  : `
    <div><span>Správně</span><b>${g.ok} z ${QN}</b></div>
    <div><span>Nejdelší série</span><b>${g.best}×</b></div>
    <div><span>Obtížnost</span><b>${DNAME[sel.diff]} — body ×${String(MULT[sel.diff]).replace(".",",")}</b></div>`;
  $("missed").innerHTML = g.miss.length
    ? "Tyhle si ještě projdi: "+g.miss.map(m=>`<b>${m.n}</b>`).join(", ")
    : "Ani jedna chyba. Celý svět v malíku!";
  $("who").textContent = player ? "Letěl "+player : "";

  // znělka podle výsledku + oslovení jménem
  const voc=vocative(player);
  const kind=stars===3?"gold":stars===2?"good":stars===1?"ok":"meh";
  const praise={
    gold:`Bravo, ${voc}! Perfektní let.`,
    good:`Výborně, ${voc}! To bylo pěkné.`,
    ok:  `Dobrá práce, ${voc}.`,
    meh: `Nevadí, ${voc}. Zkus to ještě jednou.`
  }[kind];
  if(stars>=2)confetti();
  const dur=melody(kind);
  setTimeout(()=>say(praise),dur*1000+250);

  // síň slávy
  const {top,rank}=await pushHof(crazy?g.ok:g.score);
  const me=top.find(e=>e.n===(player||"Cestovatel")&&e.s===(crazy?g.ok:g.score));
  $("board").innerHTML=`<h3>${MODES.find(m=>m.id===sel.mode).t} — nejlepší ze všech${rank&&rank<=3?" · jsi "+rank+".! 🏅":""}</h3>`+
    top.slice(0,6).map((e,i)=>hofRow(e,i,e===me)).join("");
}

/* ============ KONFETY ============ */
function confetti(){
  const cv=$("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#FFC93C","#FF5E5B","#2ED3A0","#4E8BF5","#FFF8EC"];
  const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-40-Math.random()*300,
    w:6+Math.random()*8,h:8+Math.random()*10,vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,
    r:Math.random()*6,vr:-.2+Math.random()*.4,c:rnd(cols)}));
  let n=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(n++<260)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
